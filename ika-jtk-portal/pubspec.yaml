name: ika_jtk_portal
description: "IKA JTK POLBAN — Alumni portal (Flutter Web)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  intl: ^0.20.2
  http: ^1.2.0
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  file_picker: ^11.0.2
  flutter_widget_from_html_core: ^0.17.2
  url_launcher: ^6.3.2
  image: ^4.8.0
  flutter_image_compress: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
