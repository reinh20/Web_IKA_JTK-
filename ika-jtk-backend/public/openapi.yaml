openapi: 3.0.3
info:
  title: IKA JTK Backend API
  description: |
    API untuk sistem informasi Ikatan Keluarga Alumni Jurusan Teknik Komputer
    dan Informatika (IKA JTK) Politeknik Negeri Bandung.

    **Autentikasi:** sebagian besar endpoint memerlukan header
    `Authorization: Bearer <JWT>`. Token diperoleh dari endpoint login
    (`/api/auth/login` untuk alumni, `/api/admin/auth/login` untuk admin).

    Endpoint admin (`/api/admin/*`) tunduk pada RBAC berdasarkan role
    (Super Admin, Admin Verifikator, Admin Viewer).
  version: 1.0.0
servers:
  - url: /
    description: Server saat ini (host tempat dokumentasi ini dibuka)
  - url: http://localhost:5000
    description: Development (PHP built-in server)

tags:
  - name: Auth (Alumni)
    description: Registrasi, verifikasi OTP, login, dan profil alumni
  - name: Elections (Public)
    description: Daftar pemilu publik dan voting
  - name: Upload
    description: Unggah file (avatar, dokumen, umum)
  - name: Admin Auth
    description: Autentikasi panel admin
  - name: Admin Users
    description: Manajemen akun admin (Super Admin saja)
  - name: Admin Roles
    description: Manajemen role dan permission admin (Super Admin)
  - name: Admin Alumni
    description: Manajemen & verifikasi data alumni
  - name: Admin Elections
    description: Manajemen pemilu & kandidat
  - name: Admin Berita
    description: Manajemen berita
  - name: Admin Agenda
    description: Manajemen agenda/event
  - name: Admin Loker
    description: Manajemen lowongan kerja
  - name: Admin Testimoni
    description: Moderasi testimoni alumni
  - name: Admin Pemilu
    description: Manajemen pemilu (modul terpisah)
  - name: Admin Alumni Grafis
    description: Manajemen & verifikasi pengajuan Alumni Grafis
  - name: Admin Audit Log
    description: Riwayat aktivitas dan audit log sistem
  - name: Portal Berita
    description: Berita untuk publik dan alumni
  - name: Portal Agenda
    description: Agenda untuk publik dan alumni
  - name: Portal Loker
    description: Lowongan kerja untuk publik dan alumni
  - name: Portal Alumni
    description: Direktori alumni untuk publik
  - name: Portal Lamaran
    description: Daftar lamaran pekerjaan oleh alumni
  - name: Portal Config
    description: Konfigurasi portal
  - name: Testimoni (Public)
    description: Endpoint publik untuk testimoni

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        status: { type: string, example: error }
        message: { type: string }
        error: { type: string }
    Message:
      type: object
      properties:
        message: { type: string }
    AuthResponse:
      type: object
      properties:
        message: { type: string }
        token: { type: string, description: JWT token }
        user: { type: object }
    Alumni:
      type: object
      properties:
        id: { type: string }
        nama: { type: string }
        angkatan: { type: integer }
        tanggalLahir: { type: string }
        jenisKelamin: { type: string }
        email: { type: string, format: email }
        username: { type: string }
        status: { type: string, enum: [Pending, PENDING, ACTIVE, VERIFIED, Approved] }
        emailVerified: { type: boolean }
        motto: { type: string }
        avatarUrl: { type: string }
        hp: { type: string }
        linkedin: { type: string }
        alamat: { type: string }
        nomorIjazah: { type: string, nullable: true }
        tahunLulus: { type: integer, nullable: true }
        ipk: { type: number, format: float, maximum: 4.0, nullable: true }
        ijazahFile: { type: string, nullable: true }
        alumniGrafis:
          type: object
          nullable: true
          properties:
            kategori: { type: string }
            id: { type: string }
            status: { type: string, enum: [PENDING, APPROVED, REJECTED, ARCHIVED] }
        pekerjaan: { type: array, items: { type: object } }
        prestasi: { type: array, items: { type: object } }
        keanggotaan: { type: string, enum: [Executive, 'Advisory Board', 'Supervisory Board', Alumni] }
        emailVisibility: { type: string, enum: [public, private] }
        nomorHandphoneVisibility: { type: string, enum: [public, private] }
        alamatVisibility: { type: string, enum: [public, private] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlumniGrafisRequest:
      type: object
      properties:
        id: { type: string }
        alumniId: { type: string }
        kategori: { type: string }
        grafisId: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        alumni:
          type: object
          properties:
            id: { type: string }
            nama: { type: string }
            angkatan: { type: integer }
            avatarUrl: { type: string, nullable: true }
        detail: { type: object, nullable: true }
    AuditLog:
      type: object
      properties:
        id: { type: string }
        adminId: { type: string, nullable: true }
        action: { type: string }
        entity: { type: string }
        entityId: { type: string, nullable: true }
        details: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Election:
      type: object
      properties:
        id: { type: string }
        judul: { type: string }
        deskripsi: { type: string }
        periodeStart: { type: string, format: date-time, nullable: true }
        periodeEnd: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [Draft, Active, Ongoing, Completed, Closed] }
        candidates: { type: array, items: { $ref: '#/components/schemas/Candidate' } }
        totalSuara: { type: integer }
        totalVoter: { type: integer }
        createdAt: { type: string, format: date-time }
    Candidate:
      type: object
      properties:
        id: { type: string }
        electionId: { type: string }
        alumniId: { type: string, nullable: true }
        nama: { type: string }
        angkatan: { type: integer }
        fotoUrl: { type: string }
        nomorUrut: { type: integer }
        visi: { type: string }
        misi: { type: array, items: { type: string } }
        pengalaman: { type: array, items: { type: string } }
        voteCount: { type: integer }
    Admin:
      type: object
      properties:
        id: { type: string }
        nama: { type: string }
        email: { type: string, format: email }
        username: { type: string }
        role: { type: string, description: "Nama role dari tabel AdminRoles" }
        avatarUrl: { type: string }
        createdAt: { type: string, format: date-time }
    AdminRole:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        permissions: { type: array, items: { type: string } }
        isSystem: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Berita:
      type: object
      properties:
        id: { type: string }
        judul: { type: string }
        konten: { type: string }
        bannerUrl: { type: string }
        kategori: { type: string }
        status: { type: string }
        author:
          type: object
          properties:
            id: { type: string }
            nama: { type: string }
            role: { type: string }
            avatarUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Agenda:
      type: object
      properties:
        id: { type: string }
        judul: { type: string }
        deskripsi: { type: string }
        tanggalEvent: { type: string, format: date }
        waktu: { type: string }
        lokasi: { type: string }
        bannerUrl: { type: string }
        kategori: { type: string }
        status: { type: string }
        author:
          type: object
          properties:
            id: { type: string }
            nama: { type: string }
            role: { type: string }
            avatarUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Lamaran:
      type: object
      properties:
        id: { type: string }
        lokerId: { type: string }
        posisi: { type: string }
        perusahaan: { type: string }
        logoUrl: { type: string }
        status: { type: string }
        dilamarPada: { type: string }
  responses:
    Unauthorized:
      description: Token tidak ada / tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Role tidak memiliki akses (RBAC)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  # ============ AUTH (ALUMNI) ============
  /api/auth/register:
    post:
      tags: [Auth (Alumni)]
      summary: Registrasi alumni baru (kirim OTP ke email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, angkatan, tanggalLahir, jenisKelamin, email, username, password]
              properties:
                nama: { type: string }
                angkatan: { type: integer }
                tanggalLahir: { type: string }
                jenisKelamin: { type: string }
                email: { type: string, format: email }
                username: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '201': { description: 'Registrasi berhasil, mengembalikan userId', content: { application/json: { schema: { type: object, properties: { message: { type: string }, userId: { type: string } } } } } }
        '400': { description: Validasi gagal / sudah terdaftar, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/verify-email:
    post:
      tags: [Auth (Alumni)]
      summary: Verifikasi OTP dan aktifkan akun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, description: Kode OTP 6 digit }
      responses:
        '200': { description: Email terverifikasi + token, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { description: Kode salah / kedaluwarsa }
        '404': { description: Data pendaftaran tidak ditemukan }
  /api/auth/resend-otp:
    post:
      tags: [Auth (Alumni)]
      summary: Kirim ulang kode OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: OTP baru dikirim }
        '404': { description: Data pendaftaran tidak ditemukan }
  /api/auth/login:
    post:
      tags: [Auth (Alumni)]
      summary: Login alumni
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailOrUsername, password]
              properties:
                emailOrUsername: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login berhasil + token, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { description: Kredensial salah }
        '403': { description: Email belum diverifikasi }
        
  /api/auth/forgot-password:
    post:
      tags: [Auth (Alumni)]
      summary: Meminta OTP untuk mereset kata sandi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: 'user@example.com' }
      responses:
        '200': { description: OTP reset password berhasil dikirim ke email, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '404': { description: Email tidak terdaftar, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: Gagal mengirim email, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/auth/reset-password:
    post:
      tags: [Auth (Alumni)]
      summary: Mereset kata sandi menggunakan OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email: { type: string, format: email, example: 'user@example.com' }
                otp: { type: string, example: '123456' }
                newPassword: { type: string, example: 'NewPass123!' }
      responses:
        '200': { description: Kata sandi berhasil diubah, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '400': { description: OTP tidak valid atau kedaluwarsa, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Email tidak terdaftar, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/me:
    get:
      tags: [Auth (Alumni)]
      summary: Profil alumni yang sedang login
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Data alumni, content: { application/json: { schema: { type: object, properties: { user: { $ref: '#/components/schemas/Alumni' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/auth/profile:
    put:
      tags: [Auth (Alumni)]
      summary: Perbarui profil alumni (lengkapi data → status PENDING / Menunggu Verifikasi)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nama: { type: string }
                angkatan: { type: integer }
                tanggalLahir: { type: string }
                jenisKelamin: { type: string }
                motto: { type: string }
                avatarUrl: { type: string }
                hp: { type: string }
                linkedin: { type: string }
                alamat: { type: string }
                nomorIjazah: { type: string }
                tahunLulus: { type: string }
                ipk: { type: number }
                ijazahFile: { type: string }
                pekerjaan: { type: array, items: { type: object } }
                prestasi: { type: array, items: { type: object } }
                keanggotaan: { type: string, enum: [Executive, 'Advisory Board', 'Supervisory Board', Alumni] }
                emailVisibility: { type: string, enum: [public, private] }
                nomorHandphoneVisibility: { type: string, enum: [public, private] }

                alamatVisibility: { type: string, enum: [public, private] }
      responses:
        '200': { description: Profil diperbarui }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============ ELECTIONS (PUBLIC) ============
  /api/elections:
    get:
      tags: [Elections (Public)]
      summary: Daftar semua pemilu beserta kandidat
      description: Publik. Jika menyertakan token, field `userHasVoted` akan terisi.
      responses:
        '200': { description: Daftar pemilu, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Election' } } } } }
  /api/elections/{id}:
    get:
      tags: [Elections (Public)]
      summary: Detail satu pemilu beserta kandidat
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Detail pemilu, content: { application/json: { schema: { $ref: '#/components/schemas/Election' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/elections/vote:
    post:
      tags: [Elections (Public)]
      summary: Berikan suara (alumni terverifikasi)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateId]
              properties:
                candidateId: { type: string }
      responses:
        '200': { description: Vote berhasil }
        '400': { description: Sudah memilih / pemilu tidak aktif / candidateId kosong }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Bukan alumni terverifikasi }
        '404': { description: Kandidat tidak ditemukan }

  # ============ UPLOAD ============
  /api/upload:
    post:
      tags: [Upload]
      summary: Unggah file umum (pdf/jpg/jpeg/png/webp)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 'Berhasil, mengembalikan { url }' }
        '400': { description: Format tidak valid / tidak ada file }
  /api/upload/avatar:
    post:
      tags: [Upload]
      summary: Unggah avatar (jpg/jpeg/png/webp)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses:
        '200': { description: 'Berhasil, mengembalikan { url }' }
        '400': { description: Format tidak valid }
  /api/upload/document:
    post:
      tags: [Upload]
      summary: Unggah dokumen (pdf/jpg/jpeg/png)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses:
        '200': { description: 'Berhasil, mengembalikan { url }' }
        '400': { description: Format tidak valid }

  # ============ ADMIN AUTH ============
  /api/admin/auth/login:
    post:
      tags: [Admin Auth]
      summary: Login admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailOrUsername, password]
              properties:
                emailOrUsername: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login berhasil + token, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { description: Kredensial admin tidak valid }
  /api/admin/auth/me:
    get:
      tags: [Admin Auth]
      summary: Profil admin yang sedang login
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Data admin, content: { application/json: { schema: { type: object, properties: { user: { $ref: '#/components/schemas/Admin' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ============ ADMIN USERS (Super Admin) ============
  /api/admin/users:
    get:
      tags: [Admin Users]
      summary: Daftar admin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar admin, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Admin' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Users]
      summary: Buat admin baru
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nama, email, username, password]
              properties:
                nama: { type: string }
                email: { type: string, format: email }
                username: { type: string }
                password: { type: string }
                role: { type: string }
      responses:
        '201': { description: Admin dibuat }
        '400': { description: Validasi gagal }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Admin Users]
      summary: Detail admin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Data admin }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin Users]
      summary: Perbarui admin
      security: [{ bearerAuth: [] }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Admin' } } } }
      responses: { '200': { description: Diperbarui }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Admin Users]
      summary: Hapus admin
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Dihapus }, '404': { $ref: '#/components/responses/NotFound' } }

  # ============ ADMIN ROLES (Super Admin) ============
  /api/admin/roles:
    get:
      tags: [Admin Roles]
      summary: Daftar semua role
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar role, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminRole' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Roles]
      summary: Buat role baru
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name: { type: string }
                description: { type: string }
                permissions: { type: array, items: { type: string } }
      responses:
        '201': { description: Role dibuat }
        '400': { description: Validasi gagal / nama role duplikat }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/roles/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      tags: [Admin Roles]
      summary: Perbarui role (non-sistem)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                permissions: { type: array, items: { type: string } }
      responses: { '200': { description: Diperbarui }, '400': { description: Role sistem tidak bisa diubah }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Admin Roles]
      summary: Hapus role (non-sistem)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Dihapus }, '400': { description: Role sistem atau sedang digunakan }, '404': { $ref: '#/components/responses/NotFound' } }

  # ============ ADMIN ALUMNI ============
  /api/admin/alumni:
    get:
      tags: [Admin Alumni]
      summary: Daftar semua alumni
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Daftar alumni, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Alumni' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Alumni]
      summary: Tambah alumni (langsung aktif)
      security: [{ bearerAuth: [] }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Alumni' } } } }
      responses: { '201': { description: Alumni dibuat }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/admin/alumni/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Admin Alumni]
      summary: Detail alumni
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Data alumni }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Admin Alumni]
      summary: Perbarui alumni
      security: [{ bearerAuth: [] }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Alumni' } } } }
      responses: { '200': { description: Diperbarui }, '403': { $ref: '#/components/responses/Forbidden' } }
