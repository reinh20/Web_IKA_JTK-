openapi: 3.0.0
info:
  title: IKA JTK Alumni Portal API
  version: 1.0.0
  description: API Documentation for IKA JTK Alumni Portal (Agenda Features)
servers:
  - url: http://localhost:5000/api
paths:
  /portal/agenda:
    get:
      summary: Get list of published agenda
      tags:
        - Portal Agenda
      responses:
        '200':
          description: A list of agenda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agenda'
    post:
      summary: Submit a new agenda
      tags:
        - Portal Agenda
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - judul
                - deskripsi
                - tanggalEvent
                - waktu
                - lokasi
              properties:
                judul:
                  type: string
                deskripsi:
                  type: string
                tanggalEvent:
                  type: string
                  format: date
                waktu:
                  type: string
                lokasi:
                  type: string
                bannerUrl:
                  type: string
      responses:
        '201':
          description: Agenda successfully submitted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Unverified alumni)
  /portal/agenda/{id}:
    get:
      summary: Get details of an agenda
      tags:
        - Portal Agenda
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agenda details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agenda'
        '404':
          description: Agenda not found
  /portal/agenda/{id}/reservasi:
    post:
      summary: Register/Attend an agenda
      tags:
        - Portal Agenda
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully registered for the agenda
        '400':
          description: Already registered
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Unverified alumni)
        '404':
          description: Agenda not found
  /portal/berita:
    get:
      summary: Get list of published berita
      tags:
        - Portal Berita
      responses:
        '200':
          description: A list of berita
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Berita'
    post:
      summary: Submit a new berita
      tags:
        - Portal Berita
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - judul
                - konten
              properties:
                judul:
                  type: string
                konten:
                  type: string
                kategori:
                  type: string
                bannerUrl:
                  type: string
      responses:
        '201':
          description: Berita successfully submitted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Unverified alumni)
  /portal/berita/{id}:
    get:
      summary: Get details of a berita
      tags:
        - Portal Berita
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Berita details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Berita'
        '404':
          description: Berita not found
  /portal/loker/{id}/apply:
    post:
      summary: Apply to a job vacancy
      tags:
        - Portal Loker
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jawaban:
                  type: object
                  description: JSON object containing answers to form Lamaran
      responses:
        '201':
          description: Application submitted successfully
        '400':
          description: Bad Request (e.g. invalid answers)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Unverified alumni)
        '404':
          description: Loker not found
  /portal/lamaran:
    get:
      summary: Get job application history for logged-in alumni
      tags:
        - Portal Lamaran
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lamaran'
        '401':
          description: Unauthorized
  /admin/loker/{id}/lamaran/{lamaranId}/status:
    put:
      summary: Update job application status
      tags:
        - Admin Loker
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: lamaranId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [Sedang Direview, Diterima, Ditolak]
      responses:
        '200':
          description: Status updated successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Loker or Lamaran not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Berita:
      type: object
      properties:
        id:
          type: string
        judul:
          type: string
        konten:
          type: string
        bannerUrl:
          type: string
        kategori:
          type: string
        status:
          type: string
        author:
          type: object
          properties:
            id:
              type: string
            nama:
              type: string
            role:
              type: string
            avatarUrl:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Agenda:
      type: object
      properties:
        id:
          type: string
        judul:
          type: string
        deskripsi:
          type: string
        tanggalEvent:
          type: string
          format: date
        waktu:
          type: string
        lokasi:
          type: string
        bannerUrl:
          type: string
        kategori:
          type: string
        status:
          type: string
        author:
          type: object
          properties:
            id:
              type: string
            nama:
              type: string
            role:
              type: string
            avatarUrl:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Lamaran:
      type: object
      properties:
        id:
          type: string
        lokerId:
          type: string
        posisi:
          type: string
        perusahaan:
          type: string
        logoUrl:
          type: string
        status:
          type: string
        dilamarPada:
          type: string
