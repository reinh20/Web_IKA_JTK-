services:
  postgres:
    image: postgres:16
    container_name: ikajtk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-ika-jtk}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ika-jtk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: ikajtk-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-ika-jtk}?schema=public
    env_file:
      - ./.env
    ports:
      - "${BACKEND_HOST_PORT:-5000}:80"
    volumes:
      - backend_uploads:/var/www/html/public/uploads

  cms:
    build:
      context: ../ika-jtk-cms
      dockerfile: ../ika-jtk-backend/docker/cms/Dockerfile
    container_name: ikajtk-cms
    restart: unless-stopped
    ports:
      - "${CMS_HOST_PORT:-3000}:80"

  portal:
    build:
      context: ../ika-jtk-portal
      dockerfile: ../ika-jtk-backend/docker/portal/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
    container_name: ikajtk-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_HOST_PORT:-8080}:80"

volumes:
  postgres_data:
  backend_uploads:
